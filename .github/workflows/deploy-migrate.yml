name: Deploy migrate (production DB)

on:
  push:
    branches: [deploy/vercel]

concurrency:
  group: deploy-migrate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Run production migrations
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo, pdo_mysql
          coverage: none
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction --no-dev --optimize-autoloader
      - name: Prepare .env from secrets
        run: |
          cp .env.example .env
          php artisan config:clear
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
      - name: Run migrations against production database
        run: php artisan migrate --force
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_ENV: production
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
