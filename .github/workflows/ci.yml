name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Laravel verify (tests + phpstan + pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Install JS dependencies
        run: npm ci
      - name: "Build assets (required: tests render blades with @vite)"
        run: npm run build
      - name: Prepare .env (no .env in CI; app.key is mandatory)
        run: cp .env.example .env && php artisan key:generate
      - name: Run quality gate
        run: composer verify

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, intl, pdo, pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer:v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-coverage-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-coverage-
      - name: Install PHP dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Install JS dependencies
        run: npm ci
      - name: "Build assets (required: tests render blades with @vite)"
        run: npm run build
      - name: Prepare .env (no .env in CI; app.key is mandatory)
        run: cp .env.example .env && php artisan key:generate
      - name: Run coverage
        run: composer test:coverage

  composer-audit:
    name: Composer security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-audit-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-audit-
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction
      - name: Audit
        run: composer audit --locked