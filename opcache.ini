; Production OPcache tuning for the Vercel container runtime.
;
; The dunglas/frankenphp base image already ships opcache loaded (Vercel build
; logs: "WARNING Module already installed: opcache"); Dockerfile.vercel's
; install-php-extensions entry for it is a defensive no-op. This file turns it
; on at full settings and tunes it for how the app is actually deployed.
;
; validate_timestamps=0 skips a filesystem stat() per included file on every
; request. That is only safe if PHP source can never change without a
; container restart — which is true here: each deploy builds a brand-new
; immutable image (see AGENTS.md -> Deployment), so cached bytecode can never
; go stale mid-container-life.
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=32768
opcache.validate_timestamps=0
